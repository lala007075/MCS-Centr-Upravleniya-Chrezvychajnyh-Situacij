<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — МЧС России</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <!-- Left Panel -->
        <div class="auth-left">
            <div class="auth-left-content">
                <div class="auth-emblem">🛡️</div>
                <h1>МЧС РОССИИ</h1>
                <p class="auth-desc">
                    Регистрация нового оператора в единой автоматизированной
                    информационной системе мониторинга чрезвычайных ситуаций
                </p>
                <div class="emergency-line">
                    <div class="number">112</div>
                    <div class="label">Единый номер экстренных служб</div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-form-header">
                    <h2>Регистрация</h2>
                    <p>Создайте учётную запись оператора</p>
                </div>

                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label>
                            👤 ФИО <span class="required">*</span>
                        </label>
                        <input type="text" class="form-input" id="fullName"
                               placeholder="Иванов Иван Иванович" required>
                    </div>

                    <div class="form-group">
                        <label>
                            📧 Email <span class="required">*</span>
                        </label>
                        <input type="email" class="form-input" id="email"
                               placeholder="ivanov@mchs.gov.ru" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>📱 Телефон</label>
                            <input type="tel" class="form-input" id="phone"
                                   placeholder="+7 (999) 123-45-67">
                        </div>
                        <div class="form-group">
                            <label>🏢 Подразделение</label>
                            <select class="form-input" id="department">
                                <option value="Центральный аппарат">Центральный аппарат</option>
                                <option value="ГУ МЧС по г. Москве">ГУ МЧС по г. Москве</option>
                                <option value="ГУ МЧС по Московской обл.">ГУ МЧС по Московской обл.</option>
                                <option value="ГУ МЧС по г. Санкт-Петербургу">ГУ МЧС по г. Санкт-Петербургу</option>
                                <option value="Региональный центр">Региональный центр</option>
                                <option value="Пожарная часть">Пожарная часть</option>
                                <option value="Спасательный отряд">Спасательный отряд</option>
                                <option value="ЦУКС">ЦУКС</option>
                                <option value="Другое">Другое</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            🔒 Пароль <span class="required">*</span>
                        </label>
                        <input type="password" class="form-input" id="password"
                               placeholder="Минимум 6 символов" required minlength="6">
                    </div>

                    <div class="form-group">
                        <label>
                            🔒 Подтверждение пароля <span class="required">*</span>
                        </label>
                        <input type="password" class="form-input" id="passwordConfirm"
                               placeholder="Повторите пароль" required>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="agree" required>
                        <label for="agree">Согласен с правилами обработки персональных данных</label>
                    </div>

                    <button type="submit" class="btn btn-orange" id="registerBtn">
                        📋 Зарегистрироваться
                    </button>
                </form>

                <div class="auth-footer">
                    Уже есть учётная запись?
                    <a href="/login.html">Войти</a>
                </div>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="/" style="color: var(--text-muted); font-size: 13px;">← На главную</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
