<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — МЧС России</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="auth-page">
        <!-- Left Panel -->
        <div class="auth-left">
            <div class="auth-left-content">
                <div class="auth-emblem">🛡️</div>
                <h1>МЧС РОССИИ</h1>
                <p class="auth-desc">
                    Министерство Российской Федерации по делам гражданской обороны,
                    чрезвычайным ситуациям и ликвидации последствий стихийных бедствий
                </p>
                <div class="emergency-line">
                    <div class="number">112</div>
                    <div class="label">Единый номер экстренных служб</div>
                </div>
            </div>
        </div>

        <!-- Right Panel - Form -->
        <div class="auth-right">
            <div class="auth-form-container">
                <div class="auth-form-header">
                    <h2>Вход в систему</h2>
                    <p>Введите учётные данные для доступа</p>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label>
                            📧 Email <span class="required">*</span>
                        </label>
                        <div class="form-input-icon">
                            <input type="email" class="form-input" id="email"
                                   placeholder="operator@mchs.gov.ru" required autocomplete="email">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            🔒 Пароль <span class="required">*</span>
                        </label>
                        <div class="form-input-icon">
                            <input type="password" class="form-input" id="password"
                                   placeholder="Введите пароль" required autocomplete="current-password">
                        </div>
                    </div>

                    <div class="form-checkbox">
                        <input type="checkbox" id="remember">
                        <label for="remember">Запомнить меня</label>
                    </div>

                    <button type="submit" class="btn btn-orange" id="loginBtn">
                        🔐 Войти в систему
                    </button>
                </form>

                <div class="auth-footer">
                    Нет учётной записи?
                    <a href="/register.html">Зарегистрироваться</a>
                </div>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="/" style="color: var(--text-muted); font-size: 13px;">← На главную</a>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
